<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>lejeAftaleListe</title>
    <link rel="stylesheet" th:href="@{/Styler.css}">
</head>
<body>
    <ul class="logout" th:if="${session.loggedIn}">
        <li><a th:href="@{/logout}">Log ud</a></li>
    </ul>

    <div class="container">
    <h1>Liste over Lejeaftaler</h1>

    <table class="customer-table">
        <tr class="table-header">
            <th>ID</th>
            <th>Navn</th>
            <th>Email</th>
            <th>Bil</th>
            <th>StartDato</th>
            <th>SlutDato</th>
            <th>Handling</th>
        </tr>
        <tr th:each="l : ${lejeAftaler}">
            <td th:text="${l.lejeaftale.lejeaftaleId}"></td>
            <td th:text="${l.kunde.fornavn + ' ' + l.kunde.efternavn}"></td>
            <td th:text="${l.kunde.email}"></td>
            <td th:text="${l.bil.brand + ' ' + l.bil.model + ' ' + l.bil.nummerPlade + ' - ' + l.bil.bilStatus}"></td>
            <td th:text="${#temporals.format(l.lejeaftale.startDato, 'dd-MM-yyyy')}"></td>
            <td th:text="${#temporals.format(l.lejeaftale.slutDato, 'dd-MM-yyyy')}"></td>
            <td>
                <a th:href="@{/lejeAftale/rediger/{id}(id=${l.lejeaftale.lejeaftaleId})}">Rediger</a> |
                <a th:href="@{/lejeAftale/slet/{id}(id=${l.lejeaftale.lejeaftaleId})}" onclick="return confirm('Er du sikker?')">Slet</a>
            </td>
        </tr>
    </table>

        <a href="/lejeAftale" class="function-box">Opret ny lejeAftale</a>
        <a href="/dataForside" class="function-box">Tilbage til forside</a>
    </div>

</body>
</html>
