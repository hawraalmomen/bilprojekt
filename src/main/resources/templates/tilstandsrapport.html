<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tilstandsrapport</title>
    <link rel="stylesheet" th:href="@{/Styler.css}">
</head>
<body>

<ul class="logout" th:if="${session.loggedIn}">
    <li><a th:href="@{/logout}">Log ud</a></li>
</ul>

<div class="container">
    <h1 class="title">Opret tilstandsrapport</h1>

<form action="@/{tilstandsrapport}" th:object="${rapport}" method="post">

    <label for="datoTilsyn">Dato for tilsyn:</label>
    <input type="date" th:field="*{dato}" id="datoTilsyn" required><br><br>

    <label for="kundeId">Kunde:</label>
    <select th:field="*{kundeId}" id="kundeId" required>
        <option disabled selected>-- vælg kunde --</option>
        <option th:each="k : ${kunder}"
                th:value="${k.kundeId}"
                th:text="${k.fornavn + ' ' + k.efternavn + ' - ' + k.email}">
        </option>
    </select><br><br>

    <button type="submit">Gem rapport</button>
    <button type="submit">Rediger rapport</button>
</form>
    <p><a href="/skadeForside">Tilbage</a></p>
</div>
</body>
</html>
